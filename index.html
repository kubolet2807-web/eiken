<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>英検 学習アプリ</title>
  <style>
    :root {
      --bg: #f6f8fb;
      --surface: #ffffff;
      --text: #1f2933;
      --muted: #617080;
      --line: #d9e1e8;
      --primary: #256d85;
      --primary-dark: #174c60;
      --shadow: 0 18px 45px rgba(31, 41, 51, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
    }

    .shell {
      width: min(1040px, calc(100% - 32px));
      margin: 0 auto;
      padding: 34px 0 48px;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: var(--primary);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1, p { margin: 0; letter-spacing: 0; }

    h1 {
      font-size: clamp(28px, 5vw, 44px);
      line-height: 1.15;
    }

    .lead {
      max-width: 680px;
      margin-top: 12px;
      color: var(--muted);
      line-height: 1.7;
    }

    .grade-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 14px;
      margin-top: 28px;
    }

    .grade-card {
      display: grid;
      gap: 12px;
      min-height: 174px;
      padding: 22px;
      color: inherit;
      text-decoration: none;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      transition: transform 160ms ease, border-color 160ms ease;
    }

    a.grade-card:hover {
      transform: translateY(-2px);
      border-color: var(--primary);
    }

    .grade-card strong {
      font-size: 34px;
      color: var(--primary-dark);
    }

    .grade-card span {
      color: var(--muted);
      line-height: 1.6;
    }

    .status {
      width: fit-content;
      padding: 6px 10px;
      border-radius: 999px;
      background: #fff7ed;
      color: #9a3412;
      font-size: 13px;
      font-weight: 800;
    }

    .status.open {
      background: #e6f4f1;
      color: #0f766e;
    }

    .grade-card.pending {
      opacity: 0.68;
    }
  </style>
</head>
<body>
  <main class="shell">
    <p class="eyebrow">EIKEN STUDY</p>
    <h1>英検 学習アプリ</h1>
    <p class="lead">級を選んで学習を始めます。まずは5級アプリを公開し、今後ほかの級を追加できる構成にします。</p>

    <section class="grade-grid" aria-label="級を選択">
      <a class="grade-card" href="./5/">
        <span class="status open">公開中</span>
        <strong>5級</strong>
        <span>単語、文法、会話、ミニ模試、復習、単語一覧で学習します。</span>
      </a>

      <article class="grade-card pending" aria-label="4級 準備中">
        <span class="status">準備中</span>
        <strong>4級</strong>
        <span>将来追加予定です。</span>
      </article>

      <article class="grade-card pending" aria-label="3級 準備中">
        <span class="status">準備中</span>
        <strong>3級</strong>
        <span>将来追加予定です。</span>
      </article>

      <article class="grade-card pending" aria-label="2級 準備中">
        <span class="status">準備中</span>
        <strong>2級</strong>
        <span>将来追加予定です。</span>
      </article>

      <article class="grade-card pending" aria-label="1級 準備中">
        <span class="status">準備中</span>
        <strong>1級</strong>
        <span>将来追加予定です。</span>
      </article>
    </section>
  </main>
</body>
</html>
